<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
    </header>
    <main>
        <div class="info">
            <h1>Small Actions</h1>
            <h1>Big Impact</h1>
            <h4>Scan.Earn points.Redeem rewards.</h4>
            <h4>Together let's create a cleaner tomorrow.</h4>
        </div>
        <div class="login container">
            <h2>Welcome Back!</h2>
            <h4>Login to continue your green journey.</h4>
            <form>
                <div class="form">
                    <label for="uname">Username:</label><br>
                    <input type="text" id="uname" name="uname"><br>
                    <label for="pword">Password:</label><br>
                    <input type="password" id="pword" name="pword"><br>
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Green Journey. All rights reserved.</p>
